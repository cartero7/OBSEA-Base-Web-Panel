<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control OBSEA</title>

  <script>
    (function () {
      if (location.hostname.endsWith('github.io')) {
        var base = document.createElement('base');
        base.href = '/OBSEA-Base-Web-Panel/';
        document.head.appendChild(base);
      }
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=20260212-2" />

  <style>
    .page{ min-height: 100svh; display: grid; place-items: center; padding: clamp(18px, 4vw, 54px); }
    .top{ width: min(900px, 100%); text-align: center; margin-bottom: 20px; }
    .title{ margin: 0; font-size: clamp(16px, 2.2vw, 22px); font-weight: 650; }
    .sub{ margin: 6px 0 0; font-size: 13px; color: rgba(11,18,32,.55); }
  </style>
</head>

<body>
  <main class="page">
    <header class="top">
      <h1 class="title">Control OBSEA</h1>
      <p class="sub">Accesos al panel de control OBSEA</p>
    </header>

    <nav class="grid" aria-label="Control OBSEA">
      <a class="item" href="https://control.obsea.es/" target="_blank" rel="noopener"
         aria-label="OBSEA3 (se abre en una pestaña nueva)">
        <span class="circle" aria-hidden="true"><i class="fa-solid fa-satellite-dish"></i></span>
        <span class="label">OBSEA3</span>
      </a>

      <a class="item item-back" href="control.html" aria-label="Volver a control">
        <span class="circle" aria-hidden="true"><i class="fa-solid fa-arrow-left"></i></span>
        <span class="label">Volver</span>
      </a>
    </nav>
  </main>

</body>
</html>
